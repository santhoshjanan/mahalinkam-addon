name: CI
on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with: { name: extension-zips, path: artifacts/*.zip }

  # On a v*.*.* tag whose number matches src/manifest.json, publish a GitHub
  # Release with the packaged Chrome + Firefox zips attached (these power the
  # release / downloads badges and are what you upload to the stores).
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - name: Tag must match the manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./src/manifest.json').version")"
          echo "tag=$tag  manifest=$manifest"
          test "$tag" = "$manifest" || { echo "::error::tag v$tag does not match manifest $manifest"; exit 1; }
      - run: npm ci
      - run: npm run package
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
