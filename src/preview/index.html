<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mahalinkam popup — preview</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 3rem 1rem;
        background: #f3f4f6;
        font-family: system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0b0b0c;
        }
      }
      /* Frame the popup at its real toolbar size. Sits OUTSIDE #app so it
         never interferes with live-mode element selection. */
      .frame {
        border-radius: 12px;
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.08),
          0 12px 40px rgba(0, 0, 0, 0.16);
        overflow: hidden;
        background: #fff;
      }
      @media (prefers-color-scheme: dark) {
        .frame {
          background: #171717;
          box-shadow:
            0 1px 2px rgba(0, 0, 0, 0.5),
            0 12px 40px rgba(0, 0, 0, 0.6);
        }
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div id="app"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
